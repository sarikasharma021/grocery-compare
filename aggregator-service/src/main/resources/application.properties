spring.application.name=aggregator-service
server.port=8080

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.providerService.sliding-window-size=5
resilience4j.circuitbreaker.instances.providerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.providerService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.providerService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.providerService.automatic-transition-from-open-to-half-open-enabled=true